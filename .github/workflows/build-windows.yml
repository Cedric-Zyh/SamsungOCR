name: Build Windows single-user package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run Windows environment check
        shell: pwsh
        run: python -m tools.windows_smoke --output windows-smoke.json

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm packaging/SamsungReceipt.spec

      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $workdir = (Resolve-Path dist/SamsungReceipt).Path
          $process = Start-Process -FilePath "$workdir\SamsungReceipt.exe" -WorkingDirectory $workdir -PassThru
          $ready = $false
          try {
            1..60 | ForEach-Object {
              if ($ready) { return }
              Start-Sleep -Seconds 2
              try {
                $response = Invoke-WebRequest -Uri http://127.0.0.1:5001/ -UseBasicParsing -TimeoutSec 5
                if ($response.StatusCode -eq 200) { $ready = $true }
              } catch { }
            }
            if (-not $ready) { throw "打包后的程序未能在 120 秒内提供首页" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item packaging/启动.bat release/启动.bat
          Copy-Item packaging/停止.bat release/停止.bat
          Copy-Item packaging/README-Windows.txt release/README.txt
          Copy-Item -Recurse dist/SamsungReceipt release/SamsungReceipt
          Compress-Archive -Path release/* -DestinationPath SamsungReceipt-windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SamsungReceipt-windows-x64
          path: SamsungReceipt-windows-x64.zip

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SamsungReceipt-windows-x64.zip
