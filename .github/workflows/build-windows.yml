name: Build Windows Tauri installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/windows-release
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pyinstaller
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Run Windows environment check
        shell: pwsh
        run: python -m tools.analysis.operations.windows_smoke --output windows-smoke.json

      - name: Check architecture import direction
        shell: pwsh
        run: python tools/analysis/operations/check_architecture.py

      - name: Run Python test suite
        shell: pwsh
        run: python -m pytest -q

      - name: Build bundled Flask/OCR service
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm packaging/SamsungReceipt.spec

      - name: Smoke test bundled service
        shell: pwsh
        run: |
          $workdir = (Resolve-Path dist/SamsungReceipt).Path
          $stdoutPath = Join-Path $workdir "smoke.stdout.log"
          $stderrPath = Join-Path $workdir "smoke.stderr.log"
          $process = Start-Process -FilePath "$workdir\SamsungReceipt.exe" -WorkingDirectory $workdir -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath -PassThru
          $ready = $false
          try {
            1..60 | ForEach-Object {
              if ($ready) { return }
              if ($process.HasExited) { throw "打包后的识别服务提前退出（退出码 $($process.ExitCode)）。" }
              Start-Sleep -Seconds 2
              try {
                $response = Invoke-WebRequest -Uri http://127.0.0.1:5002/ -UseBasicParsing -SkipHttpErrorCheck -TimeoutSec 5
                if ($response.StatusCode -eq 200) { $ready = $true }
              } catch { }
            }
            if (-not $ready) { throw "打包后的识别服务未能在 120 秒内提供首页。" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Stage bundled service for Tauri
        shell: pwsh
        run: |
          if (Test-Path desktop/resources/SamsungReceipt) { Remove-Item -Recurse -Force desktop/resources/SamsungReceipt }
          New-Item -ItemType Directory -Force -Path desktop/resources/SamsungReceipt | Out-Null
          Copy-Item -Recurse -Force dist/SamsungReceipt/* desktop/resources/SamsungReceipt

      - name: Install desktop dependencies
        shell: pwsh
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build Tauri NSIS installer
        shell: pwsh
        working-directory: desktop
        run: pnpm tauri build

      - name: Upload Tauri installer
        uses: actions/upload-artifact@v4
        with:
          name: SamsungReceipt-windows-x64-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/release/bundle/nsis/*.exe
