    <section data-page="records" class="records-page">
      <div id="batch-scope" class="scope-banner hidden"><span></span><button id="clear-batch" class="text-button">退出批次范围</button></div>
      <section class="results-section records-section">
        <form id="filters" class="record-filter-state"><input type="hidden" name="task_id"><input type="hidden" name="text_match" value="prefix"></form>
        <div class="records-command-bar">
          <div class="import-date-bar"><span class="date-label">导入日期</span><div class="calendar-wrap"><input id="import-date" type="hidden" name="import_date" form="filters"><button id="calendar-toggle" type="button" class="secondary-button" aria-label="选择导入日期" aria-expanded="false" aria-controls="import-calendar"></button><section id="import-calendar" class="import-calendar hidden" role="dialog" aria-label="选择导入日期"><div class="calendar-header"><button id="calendar-prev" type="button" aria-label="上个月">‹</button><input id="calendar-month" type="month" aria-label="日历月份"><button id="calendar-next" type="button" aria-label="下个月">›</button></div><div class="calendar-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="calendar-days" class="calendar-days"></div><p id="calendar-note" aria-live="polite">右上角数字表示当天导入的回单数量</p></section></div><button id="import-today" type="button" class="text-button">今天</button></div>
          <label class="record-search-label" for="record-search"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 4 4"></path></svg><input id="record-search" type="search" form="filters" name="search" placeholder="搜索文件名、订单号或客户" aria-label="搜索文件名、订单号或客户" autocomplete="off"></label>
          <div class="records-view-actions"><button id="records-more-filters" class="secondary-button header-filter-button" type="button" data-filter-popover="records" aria-expanded="false" aria-controls="filter-records"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"></path></svg><span>更多筛选</span></button><button id="review-filtered-records" type="button" class="secondary-button">复核当前结果</button><details class="records-review-more"><summary aria-label="更多记录操作" title="更多记录操作">···</summary><div><button id="records-density-toggle" type="button" aria-pressed="false">紧凑显示</button><button id="review-day-records" type="button">复核当天全部</button></div></details></div>
        </div>
        <div id="selection-toolbar" class="selection-toolbar hidden"><span id="selection-count"></span><button id="clear-record-selection" type="button" class="text-button">取消选择</button><span id="selection-readiness" role="status"></span><button id="bulk-pass" type="button" class="secondary-button">批量确认通过</button><button id="review-selected-records" type="button" class="secondary-button">复核选中</button><details class="records-review-more records-bulk-more"><summary aria-label="更多批量操作" title="更多批量操作">···</summary><div><button id="bulk-pending" type="button">批量待复核</button><button id="bulk-retry" type="button">批量重新识别</button><button id="bulk-delete" type="button">删除选中</button></div></details></div>
        <div class="records-list-heading"><div class="record-tabs" aria-label="快捷筛选"><button type="button" data-filter="" class="active">全部回单</button><button type="button" data-filter="需人工复核">待复核</button><button type="button" data-filter="通过">已通过</button><button type="button" data-filter="不通过">不通过</button><button type="button" data-filter="识别失败">识别失败</button></div><span id="record-count" role="status"></span></div>
        <div class="record-filter-note"><div class="record-filter-context"><div id="active-filters" class="active-filters" aria-label="已应用的筛选条件"></div><span id="record-filter-status" role="status" class="sr-only">正在加载回单…</span></div><button class="text-button" type="reset" form="filters" id="reset-filters">清空筛选</button></div>
        <div class="table-wrap record-filter-table" tabindex="0" role="region" aria-label="筛选后的回单列表，可滚动查看"><table class="records-table"><colgroup><col class="selection-col"><col class="file-col"><col class="customer-col"><col class="signature-col"><col class="date-col"><col class="seal-col"><col class="verdict-col"><col class="action-col"></colgroup><thead><tr><th scope="col"><input id="select-all" type="checkbox" aria-label="全选当前页"></th><th scope="col" class="record-file-column">回单 / 订单号</th><th scope="col" class="record-customer-column">客户</th><th scope="col">签名核对</th><th scope="col" class="record-date-column">日期核对</th><th scope="col">客户印章</th><th scope="col">处理结果</th><th scope="col">操作</th></tr></thead><tbody id="records-body"><tr><td colspan="8" class="empty-state">正在加载记录…</td></tr></tbody></table></div>
        <nav class="result-pagination" aria-label="回单记录分页"><span id="records-page-info" role="status"></span><label class="page-size-label">每页<select id="records-page-size" aria-label="每页显示回单数"><option value="25">25 张</option><option value="50">50 张</option><option value="100" selected>100 张</option></select></label><button id="records-page-prev" type="button" class="mini-button" disabled>上一页</button><button id="records-page-next" type="button" class="mini-button" disabled>下一页</button></nav>
        <div id="filter-records" class="table-popover records-filter-popover hidden" role="dialog" aria-labelledby="record-filters-title"><div class="popover-heading"><strong id="record-filters-title">筛选回单</strong><button type="button" data-close-popover aria-label="关闭回单筛选">×</button></div><div class="records-filter-grid">
            <label><span>文件名 / 订单号开头</span><input id="column-filter-search_prefix" class="popover-filter-input" form="filters" name="search_prefix" type="search" aria-label="文件名或订单号开头" placeholder="输入开头，如 7" autocomplete="off"></label>
            <label><span>客户名称</span><input id="column-filter-customer" class="popover-filter-input" form="filters" name="customer" type="search" aria-label="输入客户名称" placeholder="输入客户名称" autocomplete="off"></label>
            <label><span>签收日期</span><input id="column-filter-date" class="popover-filter-input" form="filters" name="date" type="date" aria-label="筛选签收日期" placeholder="筛选签收日期" autocomplete="off"></label>
            <label><span>日期核验</span><select id="column-filter-date_status" class="popover-filter-input" form="filters" name="date_status" aria-label="筛选签收日期核验"><option value="">全部</option><option>匹配</option><option>匹配待确认</option><option>不匹配</option><option>未识别</option><option>需人工复核</option><option>未执行</option></select></label>
            <label><span>客户印章</span><select id="column-filter-seal_status" class="popover-filter-input" form="filters" name="seal_status" aria-label="筛选客户印章核验"><option value="">全部</option><option>匹配</option><option>匹配待确认</option><option>部分匹配</option><option>不匹配</option><option>未识别</option><option>需人工复核</option><option>未执行</option></select></label>
            <label><span>处理结果</span><select id="column-filter-overall" class="popover-filter-input" form="filters" name="overall" aria-label="筛选整体结论"><option value="">全部</option><option>通过</option><option>需人工复核</option><option>不通过</option><option>识别失败</option></select></label>
            <label><span>人工复核状态</span><select id="column-filter-review_status" class="popover-filter-input" form="filters" name="review_status" aria-label="筛选复核状态"><option value="">全部</option><option>无需复核</option><option>待复核</option><option>确认通过</option><option>确认不通过</option></select></label>
        </div><div class="records-filter-footer"><span>条件更改后自动筛选</span><button type="reset" form="filters" class="text-button">清空筛选</button><button type="button" class="secondary-button" data-close-popover>完成</button></div></div>
      </section>
    </section>
