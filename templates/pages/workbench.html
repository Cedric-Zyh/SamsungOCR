<p id="progress-note" class="progress-note receipt-page-notice" role="status"></p>
<p id="queue-start-remote-note" class="receipt-page-notice hidden">所选识别方案包含远程服务，开始后会上传回单用于识别。</p>
<dialog id="dzt-result-dialog" class="dzt-result-dialog" aria-labelledby="dzt-result-title"><header><h2 id="dzt-result-title">单证通结果</h2><button id="dzt-result-close" type="button" class="secondary-button">关闭</button></header><div id="dzt-result-body"></div><details class="dzt-resubmit"><summary>更多操作</summary><p>重新提交会产生新的识别请求，原请求记录会保留。</p><button id="dzt-resubmit" type="button" class="secondary-button">重新提交单证通</button></details></dialog>
<dialog id="task-drawer" class="task-drawer" aria-labelledby="task-drawer-title">
  <header class="task-drawer-header">
    <div class="task-drawer-brand"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="16" rx="2"/><rect x="9" y="3" width="6" height="4" rx="1.5"/><path d="M9 11h6M9 15h6M9 18h4"/></svg><div><h2 id="task-drawer-title">任务详情</h2><p>查看当天识别进度与待处理任务</p></div></div>
    <button id="close-task-drawer" type="button" class="task-drawer-close" aria-label="关闭任务详情"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  </header>
  <div class="task-drawer-content">
    <div class="task-batch-field">
      <span class="task-batch-day"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M7 14h2M15 14h2M7 17h2"/></svg><span id="task-drawer-day">当前日期</span></span>
    </div>
    <section class="task-batch-summary" aria-label="当天回单进度">
      <div class="task-batch-heading">
        <div class="task-batch-total"><strong id="overview-total">—</strong><span>张回单</span></div>
        <div class="task-summary-actions"><div class="task-summary-buttons"><button id="queue-toggle" type="button" class="secondary-button" aria-describedby="task-pause-scope" disabled>暂停识别</button><button id="task-view-records" type="button" class="secondary-button" title="查看当天全部回单">查看当天回单 <span aria-hidden="true">↗</span></button></div><small id="task-pause-scope">暂停作用于所有日期的任务</small></div>
      </div>
      <strong id="task-batch-title" class="sr-only">当天全部回单</strong>
      <div class="task-summary-progress"><span>完成进度<span class="sr-only">，已结束 <span id="overview-completed">—</span> 张</span></span><span id="overview-percent">—</span></div>
      <div class="progress-track" role="progressbar" aria-label="当天回单识别进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="task-progress"></span></div>
      <div class="task-summary-metrics"><div><span>成功</span><strong id="task-count-succeeded">—</strong></div><div><span>失败</span><strong id="task-count-failed">—</strong></div><div><span>待处理</span><strong id="task-count-pending">—</strong></div></div>
      <p id="overview-remaining" class="sr-only"></p><span id="task-summary" class="sr-only" role="status"></span>
    </section>
    <section class="receipt-task-strip task-drawer-services" aria-label="识别服务状态">
      <div class="sr-only"><span id="task-strip-scope"></span><span id="workbench-state-pill">加载中</span><span id="task-strip-counts">正在获取任务…</span></div>
      <section class="dzt-task-strip" aria-label="单证通任务">
        <div class="dzt-status-copy"><span class="dzt-provider-label">单证通</span><span id="dzt-summary" role="status">正在获取任务…</span><small id="dzt-auto-note"></small></div>
        <div class="dzt-strip-actions">
          <button id="dzt-query-all" type="button" class="dzt-query-button" aria-label="查询待返回的单证通结果" disabled hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 7a6.5 6.5 0 1 0 .4 5M16 3v4h-4"/></svg><span>查询结果</span></button>
          <details class="dzt-more dzt-control-menu">
            <summary class="dzt-menu-trigger" aria-label="单证通设置" title="单证通设置"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="1.2"/><circle cx="10" cy="10" r="1.2"/><circle cx="16" cy="10" r="1.2"/></svg></summary>
            <div class="dzt-settings-panel">
              <p class="dzt-settings-title">单证通设置</p>
              <button id="dzt-submit-toggle" type="button" class="dzt-preference" role="switch" aria-checked="true" disabled><span>允许新提交</span><span class="dzt-switch" aria-hidden="true"></span></button>
              <button id="dzt-query-toggle" type="button" class="dzt-preference" role="switch" aria-checked="true" disabled><span>自动查询</span><span class="dzt-switch" aria-hidden="true"></span></button>
              <p class="dzt-settings-hint">暂停新提交后，已提交的任务仍可查询。</p>
            </div>
          </details>
        </div>
      </section>
    </section>
    <p id="queue-pause-notice" class="queue-pause-notice hidden" role="status"></p>
    <section id="task-section" class="hidden" aria-labelledby="workbench-list-title">
      <h3 id="workbench-list-title">任务列表</h3>
      <div class="task-drawer-tabs" aria-label="任务状态"><button type="button" data-task-tab="processing" aria-pressed="true">进行中 <b data-work-count="processing">—</b></button><button type="button" data-task-tab="remote" aria-pressed="false">单证通 <b data-work-count="waiting_remote">—</b></button><button type="button" data-task-tab="ready" aria-pressed="false">待开始 <b data-work-count="ready">—</b></button><button type="button" data-task-tab="failed" aria-pressed="false">异常 <b data-work-count="failed">—</b></button></div>
      <div class="task-queue-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="workbench-search" type="search" placeholder="搜索文件名、订单号" aria-label="搜索任务文件名或订单号"><span id="workbench-visible-count" class="sr-only" role="status"></span></div>
      <div id="task-queue-select" class="task-queue-select hidden"><label><input id="workbench-select-all" type="checkbox">全选当前任务</label><span>正在识别的任务不可勾选</span></div>
      <div id="queue-selection" class="queue-selection hidden"><span id="queue-selection-count"></span><button id="queue-selection-clear" type="button" class="text-button">取消选择</button><button id="queue-selected-start" type="button" class="mini-button">开始所选</button><button id="queue-selected-withdraw" type="button" class="mini-button">取消所选排队</button><button id="queue-selected-delete" type="button" class="mini-button">删除所选</button></div>
      <div id="queue" class="task-card-list" aria-live="off"></div>
      <div class="task-queue-footer"><span id="workbench-page-note"></span><button id="workbench-more" type="button" class="text-button hidden">再显示 50 张</button></div>
    </section>
    <div id="task-failure-notice" class="task-failure-notice hidden"><span></span><button id="task-show-failures" type="button" class="secondary-button">查看异常</button></div>
  </div>
  <footer class="task-drawer-footer"><div><span id="queue-control-label" role="status">正在获取后台状态</span><p>关闭面板不影响后台识别</p></div><button id="refresh-progress" type="button" class="secondary-button">刷新</button></footer>
</dialog>
