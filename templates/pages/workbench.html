<section data-page="progress" class="hidden workbench-page">
  <section class="workbench-overview-card" aria-labelledby="workbench-overview-title">
    <div class="workbench-overview-head">
      <div class="workbench-overview-title"><span id="workbench-overview-title">识别任务</span><span class="workbench-state-pill" id="workbench-state-pill">加载中</span></div>
      <div class="workbench-overview-actions"><a class="primary-button" href="#import"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></svg>导入回单</a><button id="queue-toggle" type="button" class="mini-button" disabled>暂停队列</button></div>
    </div>
    <div class="workbench-overview-progress">
      <div class="overview-count">已结束 <strong><span id="overview-completed">—</span> / <span id="overview-total">—</span></strong> 张</div>
      <div class="progress-track" role="progressbar" aria-label="当日处理进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="task-progress"></span></div><b id="overview-percent">—</b>
      <small id="overview-remaining" class="sr-only">正在加载当天数据…</small><span id="task-summary" class="sr-only" role="status"></span>
    </div>
    <div class="workbench-filter-buttons workbench-state-cards" aria-label="筛选任务状态">
      <button type="button" data-work-filter="ready" aria-pressed="false"><span>待开始</span><span class="overview-stat-value"><b data-work-count="ready">—</b><em>张</em></span></button>
      <button type="button" data-work-filter="queued" aria-pressed="false"><span>排队中</span><span class="overview-stat-value"><b data-work-count="queued">—</b><em>张</em></span></button>
      <button type="button" data-work-filter="running" aria-pressed="false"><span>识别中</span><span class="overview-stat-value"><b data-work-count="running">—</b><em>张</em></span></button>
      <button type="button" data-work-filter="completed" aria-pressed="false"><span>已完成</span><span class="overview-stat-value"><b data-work-count="completed">—</b><em>张</em></span></button>
      <button type="button" data-work-filter="failed" aria-pressed="false"><span>失败</span><span class="overview-stat-value"><b data-work-count="failed">—</b><em>张</em></span></button>
    </div>
    <p id="queue-pause-notice" class="queue-pause-notice hidden" role="status"></p>
  </section>
  <p id="progress-note" class="progress-note" role="status">正在加载当天任务…</p>
  <section id="task-section" class="hidden workbench-tasks" aria-labelledby="workbench-list-title">
    <div class="workbench-taskbar"><div class="workbench-list-heading"><h2 id="workbench-list-title">任务队列</h2><span id="workbench-visible-count" role="status"></span></div><label class="queue-review-toggle"><span>待复核</span><input id="workbench-needs-review" type="checkbox" role="switch"></label></div>
    <div class="queue-tools"><input id="workbench-search" type="search" placeholder="搜索文件名、订单号" aria-label="搜索任务文件名或订单号"><button type="button" class="text-button" data-work-filter="all" aria-pressed="true">全部状态</button><button id="queue-start" type="button" class="primary-button" disabled>开始全部待开始</button></div>
    <div id="queue-selection" class="queue-selection hidden"><span id="queue-selection-count"></span><button id="queue-selection-clear" type="button" class="text-button">取消选择</button><button id="queue-selected-review" type="button" class="mini-button hidden">复核所选</button><button id="queue-selected-start" type="button" class="mini-button">开始所选</button><button id="queue-selected-withdraw" type="button" class="mini-button">取消所选排队</button></div>
    <div class="table-wrap workbench-table-wrap" tabindex="0" role="region" aria-label="单据任务队列">
      <table class="workbench-table"><colgroup><col class="queue-check-col"><col class="workbench-file-col"><col class="workbench-status-col"><col class="workbench-result-col"><col class="workbench-action-col"></colgroup><thead><tr><th><input id="workbench-select-all" type="checkbox" aria-label="全选当前显示的可操作单据"></th><th>单据名称</th><th>状态</th><th>当前步骤 / 进度</th><th>操作</th></tr></thead><tbody id="queue"><tr><td colspan="5" class="empty-state">正在加载任务…</td></tr></tbody></table>
    </div>
    <div class="workbench-list-footer"><span id="workbench-page-note" role="status"></span><button id="workbench-more" type="button" class="text-button hidden">再显示 50 张</button><div class="workbench-queue-footer"><span id="queue-control-label" role="status"></span><button id="refresh-progress" type="button" class="text-button">刷新</button></div></div>
  </section>
</section>
